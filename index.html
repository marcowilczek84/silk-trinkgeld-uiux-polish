<main id="app"><section class="intro"><h1>Trinkgeld berechnen</h1><p>Ein Tag oder ein frei gewählter Zeitraum.</p></section><div class="mode"><button id="modeDay" class="active" onclick="setMode('day')">Heute / ein Tag</button><button id="modePeriod" onclick="setMode('period')">Zeitraum</button></div><section class="panel"><div class="step">1 · Zeitraum</div><div id="dayPicker" class="field"><label>Datum</label><input id="singleDate" type="date" onchange="buildVisibleDays()"></div><div id="periodPicker" class="grid2 hidden"><div class="field"><label for="periodStart">Von</label><input id="periodStart" type="date" onchange="buildVisibleDays()"></div><div class="field"><label for="periodEnd">Bis</label><input id="periodEnd" type="date" onchange="buildVisibleDays()"></div></div><p id="periodError" class="hint hidden" role="alert"></p></section><section class="panel"><div class="step">2 · Trinkgeld & Dienste</div><h2 id="daysTitle">Tag erfassen</h2><p class="hint">Tag öffnen, Beträge eintragen und pro Mitarbeiter den Dienst wählen.</p><div id="days" class="day-list"></div></section><section id="resultSection" class="hidden"><div id="result" class="result"></div><div class="result-actions"><button id="saveResultBtn" class="savewide" onclick="saveCalculation()">Speichern</button><button class="secondary" onclick="window.print()">PDF / Drucken</button><button class="secondary" onclick="resetCurrent()">Neue Berechnung</button></div></section><div class="actionbar"><button class="calcbtn" onclick="calculate()">Trinkgeld berechnen</button></div></main>
<script>const DEFAULT_STAFF=["Sandra","Marco","Sladjana","Manuela","Emily","Martin","Sascha","Ben","Phuong Anh Pham","David","Roman","Pengcheng Zhao"],DEFAULT_SHIFTS=[{name:"F1",f:1,s:0,color:"#d9dde2"},{name:"FR8",f:.75,s:.25,color:"#d9dde2"},{name:"FFR",f:.65,s:.35,color:"#d9dde2"},{name:"MD10",f:.5,s:.5,color:"#e4e7eb"},{name:"MD",f:.35,s:.65,color:"#e4e7eb"},{name:"MD2",f:.35,s:.65,color:"#e4e7eb"},{name:"SP1",f:0,s:1,color:"#1015e8"},{name:"SP2",f:0,s:1,color:"#ff13c8"},{name:"SP3",f:0,s:1,color:"#0d7778"}];let STAFF=JSON.parse(localStorage.getItem('silk_staff')||'null')||DEFAULT_STAFF.slice(),SHIFTS=JSON.parse(localStorage.getItem('silk_shifts')||'null')||DEFAULT_SHIFTS.map(x=>({...x})),FACTOR={},MODE='day';const STORE='silk_v12_data',PW='silk_v12_password',MODEKEY='silk_tip_mode';function rebuild(){FACTOR={};SHIFTS.forEach(x=>FACTOR[x.name]={f:+x.f,s:+x.s,color:x.color||'#eee'})}rebuild();function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function chf(n){return'CHF '+Math.round(Number(n||0)).toLocaleString('de-CH',{minimumFractionDigits:0,maximumFractionDigits:0})}function unlock(){lock.classList.add('hidden');app.classList.remove('hidden');loadState()}pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});function logout(){closeSettings()}function changePassword(){}function openSettings(){drawer.classList.add('open');drawerBack.classList.add('open')}function closeSettings(){drawer.classList.remove('open');drawerBack.classList.remove('open')}function backSettings(){settingsHome.classList.remove('hidden');staffEditor.classList.add('hidden');shiftEditor.classList.add('hidden');savedEditor.classList.add('hidden')}function openEditor(w){settingsHome.classList.add('hidden');staffEditor.classList.toggle('hidden',w!=='staff');shiftEditor.classList.toggle('hidden',w!=='shifts');savedEditor.classList.toggle('hidden',w!=='saved');if(w==='staff')renderEmployees();else if(w==='shifts')renderShifts();else if(w==='saved')renderSavedCalculations()}function renderEmployees(){employeeEditor.innerHTML=STAFF.map((n,i)=>`<div class="editrow"><input id="emp${i}" value="${esc(n)}"><button class="mini danger" onclick="removeEmployee(${i})">Löschen</button></div>`).join('')}function addEmployee(){STAFF.push('Neuer Mitarbeiter');renderEmployees()}function removeEmployee(i){if(confirm('Mitarbeiter wirklich löschen?')){STAFF.splice(i,1);renderEmployees()}}function saveEmployees(){STAFF=STAFF.map((_,i)=>(document.getElementById('emp'+i)?.value||'').trim()).filter(Boolean);if(!STAFF.length)return alert('Mindestens ein Mitarbeiter ist erforderlich.');localStorage.setItem('silk_staff',JSON.stringify(STAFF));buildVisibleDays();backSettings();alert('Mitarbeiter gespeichert.')}function renderShifts(){shiftEditorRows.innerHTML=SHIFTS.map((s,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="editrow"><input id="shn${i}" value="${esc(s.name)}"><button class="mini danger" onclick="removeShift(${i})">Löschen</button></div><div class="grid2"><div class="field"><label>Früh %</label><input id="shf${i}" type="number" value="${Math.round(s.f*100)}"></div><div class="field"><label>Spät %</label><input id="shs${i}" type="number" value="${Math.round(s.s*100)}"></div></div></div>`).join('')}function addShift(){SHIFTS.push({name:'NEU',f:.5,s:.5,color:'#eee'});renderShifts()}function removeShift(i){if(SHIFTS.length>1&&confirm('Dienst wirklich löschen?')){SHIFTS.splice(i,1);renderShifts()}}function saveShifts(){const n=SHIFTS.map((s,i)=>({name:(document.getElementById('shn'+i)?.value||'').trim().toUpperCase(),f:+(document.getElementById('shf'+i)?.value||0)/100,s:+(document.getElementById('shs'+i)?.value||0)/100,color:s.color||'#eee'})).filter(x=>x.name);if(new Set(n.map(x=>x.name)).size!==n.length)return alert('Jeder Dienstname darf nur einmal vorkommen.');const b=n.find(x=>Math.abs(x.f+x.s-1)>.001);if(b)return alert(`Bei ${b.name} müssen Früh und Spät zusammen function getSavedCalculations(){try{return JSON.parse(localStorage.getItem(SAVEDKEY)||'[]')}catch(e){return[]}}
function saveCalculation(){
  if(!LAST_RESULT)return alert('Bitte zuerst Trinkgeld berechnen.');
  const saved=getSavedCalculations();
  const item={...LAST_RESULT,id:Date.now(),savedAt:new Date().toISOString()};
  saved.unshift(item);
  localStorage.setItem(SAVEDKEY,JSON.stringify(saved.slice(0,100)));
  const b=document.getElementById('saveResultBtn');
  if(b){b.textContent='Gespeichert ✓';b.disabled=true}
}
function deleteSavedCalculation(id){
  if(!confirm('Gespeicherte Berechnung wirklich löschen?'))return;
  localStorage.setItem(SAVEDKEY,JSON.stringify(getSavedCalculations().filter(x=>x.id!==id)));
  renderSavedCalculations();
}
function renderSavedCalculations(){
  const el=document.getElementById('savedCalculations');if(!el)return;
  const saved=getSavedCalculations();
  if(!saved.length){el.innerHTML='<div class="emptyhint">Noch keine Berechnung gespeichert.</div>';return}
  el.innerHTML=saved.map(x=>{
    const dt=new Date(x.savedAt);
    const label=x.label||'Trinkgeld-Berechnung';
    const persons=(x.people||[]).map(p=>`${esc(p.name)}: ${chf(p.amount)}`).join('<br>');
    return `<div class="savedcalc"><div class="savedcalc-head"><div><strong>${esc(label)}</strong><small>${new Intl.DateTimeFormat('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(dt)}</small></div><div class="savedcalc-total">${chf(x.total)}</div></div><div class="savedcalc-details">${persons||'Keine Mitarbeiter im Dienst'}<br>Küche: ${chf(x.kitchen)} · Housekeeping: ${chf(x.housekeeping)}</div><div class="savedcalc-actions"><button class="danger" onclick="deleteSavedCalculation(${x.id})">Löschen</button></div></div>`
  }).join('')
}
function exportBackup(){saveState();const d={version:5,staff:STAFF,shifts:SHIFTS,current:getState(),saved:getSavedCalculations()},b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Silk-Trinkgeld-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}async function importBackup(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.staff)||!Array.isArray(d.shifts))throw 0;localStorage.setItem('silk_staff',JSON.stringify(d.staff));localStorage.setItem('silk_shifts',JSON.stringify(d.shifts));if(d.current)localStorage.setItem(STORE,JSON.stringify(d.current));if(Array.isArray(d.saved))localStorage.setItem(SAVEDKEY,JSON.stringify(d.saved));alert('Backup importiert.');location.reload()}catch(e){alert('Backup konnte nicht importiert werden.')}}function dateIn(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function initDates(){const n=new Date();singleDate.value=dateIn(n);periodStart.value=dateIn(new Date(n.getFullYear(),n.getMonth(),1));periodEnd.value=dateIn(n)}
function syncPeriodLimits(){}function setMode(m){MODE=m;localStorage.setItem(MODEKEY,m);modeDay.classList.toggle('active',m==='day');modePeriod.classList.toggle('active',m==='period');dayPicker.classList.toggle('hidden',m!=='day');periodPicker.classList.toggle('hidden',m!=='period');daysTitle.textContent=m==='day'?'Tag erfassen':'Zeitraum erfassen';buildVisibleDays();resultSection.classList.add('hidden')}function visibleDates(){
 if(MODE==='day')return[new Date((singleDate.value||dateIn(new Date()))+'T12:00:00')];
 const from=periodStart.value,to=periodEnd.value,err=document.getElementById('periodError');
 if(!from||!to||to<from){err.textContent='Bitte einen gültigen Zeitraum auswählen: „Bis“ muss nach „Von“ liegen.';err.classList.remove('hidden');return[]}
 const a=new Date(from+'T12:00:00'),b=new Date(to+'T12:00:00');
 const count=Math.round((b-a)/86400000)+1;
 if(count>93){err.textContent='Bitte höchstens 93 Tage auswählen.';err.classList.remove('hidden');return[]}
