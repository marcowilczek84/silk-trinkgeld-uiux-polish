name: C2 isolated Supabase acceptance
on:
  push:
    branches: [tips-v14-c-whole-chf-complete-period-20261016]
    paths:
      - '.github/workflows/c2-supabase-isolated.yml'
      - 'tests/ci/**'
      - 'docs/production/**'
      - 'v14-prototypes/**'
      - 'package*.json'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'tests/*.mjs'
      - 'tests/ui-review/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: silk-c2-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      ui_only: ${{ steps.scope.outputs.ui_only }}
      late_only: ${{ steps.scope.outputs.late_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Bound review-only changes to the accepted handover
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node tests/ui-review/scope.mjs
  ui-review:
    needs: scope
    if: needs.scope.outputs.ui_only == 'true' && github.repository == 'marcowilczek84/silk-trinkgeld-uiux-polish' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 06e139b83c562186c1b1a9933681801d4332789f
          path: .ci-ui-baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Locked dependencies and affected workflow regressions only
        run: |
          npm ci
          node --test tests/c2-ux-review.test.mjs tests/draft-workflow.test.mjs tests/c2-ui.test.mjs tests/c2-operator-ui.test.mjs
          npx eslint draft-workflow.js c2-integration.js c2-workflow-ui.js sync-status.js tests/c2-ux-review.test.mjs
          npm run typecheck
      - name: Build cloud-free candidate and accepted baseline
        env:
          SILK_LOCAL_ONLY: '1'
        run: |
          npm run build
          ln -s "$GITHUB_WORKSPACE/node_modules" .ci-ui-baseline/node_modules
          node .ci-ui-baseline/scripts/build.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Targeted Chromium UI checks (emulation only)
        run: node tests/ui-review/browser.mjs
      - name: Targeted WebKit UI checks (emulation only)
        if: ${{ !cancelled() }}
        env:
          QA_BROWSER: webkit
        run: node tests/ui-review/browser.mjs
  late-input:
    needs: scope
    if: needs.scope.outputs.late_only == 'true' && github.repository == 'marcowilczek84/silk-trinkgeld-uiux-polish' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Targeted blank late-input regressions
        run: |
          npm ci
          node --test tests/ui-review/late-empty.test.mjs
          node --check tests/ui-review/late-browser.mjs
      - name: Build cloud-free candidate
        env:
          SILK_LOCAL_ONLY: '1'
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium blank late-input flow (emulation only)
        run: node tests/ui-review/late-browser.mjs
      - name: WebKit blank late-input flow (emulation only)
        if: ${{ !cancelled() }}
        env:
          QA_BROWSER: webkit
        run: node tests/ui-review/late-browser.mjs
  isolated-supabase:
    needs: scope
    # Public-repository standard Linux runner only. No larger/paid runner, secrets,
    # environment credentials, platform login/link, cache or artifact storage.
    if: needs.scope.outputs.ui_only != 'true' && needs.scope.outputs.late_only != 'true' && github.repository == 'marcowilczek84/silk-trinkgeld-uiux-polish' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SILK_C2_CI: synthetic-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: supabase/supabase
          ref: bc27d2661edd09a5d0b8d76ce33da6d4071a756e
          sparse-checkout: docker
          path: .ci-supabase-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Install locked test dependencies
        run: npm ci
      - name: Prepare isolated stack with ephemeral credentials
        run: node tests/ci/stack.mjs prepare
      - name: Start complete local Supabase stack
        run: node tests/ci/stack.mjs start
      - name: Native PostgreSQL, PostgREST, Auth and Realtime acceptance
        run: node --test --test-concurrency=1 tests/ci/native.test.mjs
      - name: Existing regressions and C2 reference rules
        run: |
          npm test
          npm run test:variant-c
          npm run lint
          npx eslint tests/ci/*.mjs
          npm run typecheck
      - name: Build integrated local candidate
        id: build_candidate
        run: node tests/ci/stack.mjs build
      - name: Install browser for integrated candidate
        id: install_browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium real API operator flow (emulation only)
        run: node tests/ci/browser.mjs
      - name: WebKit real API operator flow (emulation only)
        if: ${{ !cancelled() && steps.build_candidate.outcome == 'success' && steps.install_browsers.outcome == 'success' }}
        run: QA_BROWSER=webkit node tests/ci/browser.mjs
      - name: Sanitized version and test evidence
        if: always()
        run: node tests/ci/stack.mjs report
      - name: Remove disposable stack and credentials
        if: always()
        run: node tests/ci/stack.mjs stop
